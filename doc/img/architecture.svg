<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc"
     font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif">
  <title id="arch-title">mac-mlx-cluster architecture</title>
  <desc id="arch-desc">You talk to mlx-cluster or mlxctl. mlx-cluster routes to one of three serving modes — server (the M1's always-on mlx_lm.server LaunchAgent), solo (a local spawn on this Mac), or cluster (both Macs, tensor-parallel over mlx.launch) — all three and mlxctl read the same Hugging Face cache, and macmon feeds live stats back into mlx-cluster every 2 seconds.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L9,5 L0,10 z" fill="#8a8a8e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L9,5 L0,10 z" fill="#e8813a"/>
    </marker>
  </defs>

  <!-- page -->
  <rect x="0" y="0" width="960" height="600" rx="16" fill="#111113"/>

  <!-- zone: serving mode (drawn before arrows/nodes) -->
  <rect x="480" y="90" width="280" height="330" rx="8" fill="rgba(240,240,242,0.02)" stroke="rgba(240,240,242,0.10)" stroke-width="0.8"/>
  <rect x="492" y="94" width="108" height="14" rx="2" fill="#111113"/>
  <text x="496" y="104" fill="rgba(240,240,242,0.40)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SERVING MODE</text>

  <!-- ============ ARROWS (behind nodes) ============ -->

  <!-- you -> mlx-cluster / mlxctl -->
  <path d="M140,195 H172 Q180,195 180,187 V180 Q180,172 188,172 H220" fill="none" stroke="#8a8a8e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M108,245 H156 Q164,245 164,253 V280 Q164,288 172,288 H220" fill="none" stroke="#8a8a8e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- mlx-cluster -> three modes (headline flow: accent) -->
  <path d="M420,156 H458 Q460,156 460,158 V160 Q460,162 462,162 H500" fill="none" stroke="#e8813a" stroke-width="1.3" marker-end="url(#arrow-accent)"/>
  <path d="M420,172 H452 Q460,172 460,180 V250 Q460,258 468,258 H500" fill="none" stroke="#e8813a" stroke-width="1.3" marker-end="url(#arrow-accent)"/>
  <path d="M420,188 H452 Q460,188 460,196 V350 Q460,358 468,358 H500" fill="none" stroke="#e8813a" stroke-width="1.3" marker-end="url(#arrow-accent)"/>

  <!-- three modes -> HF cache -->
  <path d="M740,162 H757 Q765,162 765,170 V237 Q765,245 773,245 H790" fill="none" stroke="#8a8a8e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M740,258 H763 Q765,258 765,260 V260 Q765,262 767,262 H790" fill="none" stroke="#8a8a8e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M740,358 H757 Q765,358 765,350 V288 Q765,280 773,280 H790" fill="none" stroke="#8a8a8e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- mlxctl -> HF cache, routed under the zone (no crossings) -->
  <path d="M300,316 V412 Q300,420 308,420 H852 Q860,420 860,412 V314" fill="none" stroke="#8a8a8e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- macmon -> mlx-cluster, dashed, routed via the clear top margin -->
  <path d="M860,460 V52 Q860,44 852,44 H328 Q320,44 320,52 V140" fill="none" stroke="#e8813a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
  <rect x="552" y="34" width="76" height="13" rx="2" fill="#111113"/>
  <text x="590" y="44" text-anchor="middle" fill="#9a9a9e" font-size="8" font-style="italic" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">stats / 2s</text>

  <!-- ============ NODES ============ -->

  <!-- you -->
  <circle cx="100" cy="200" r="40" fill="rgba(154,154,158,0.10)" stroke="#6f6f74" stroke-width="1.2"/>
  <text x="100" y="205" text-anchor="middle" fill="#f0f0f2" font-size="13" font-weight="600">you</text>

  <!-- mlx-cluster — focal -->
  <rect x="220" y="140" width="200" height="64" rx="8" fill="rgba(232,129,58,0.14)" stroke="#e8813a" stroke-width="1.4"/>
  <text x="320" y="168" text-anchor="middle" fill="#f5ede6" font-size="14" font-weight="600">mlx-cluster</text>
  <text x="320" y="185" text-anchor="middle" fill="#c99a72" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">chat + /agent</text>

  <!-- mlxctl -->
  <rect x="220" y="260" width="160" height="56" rx="8" fill="#18181b" stroke="rgba(240,240,242,0.30)" stroke-width="1"/>
  <text x="300" y="293" text-anchor="middle" fill="#f0f0f2" font-size="12" font-weight="600">mlxctl</text>

  <!-- /mode server -->
  <rect x="500" y="130" width="240" height="64" rx="8" fill="#18181b" stroke="rgba(240,240,242,0.30)" stroke-width="1"/>
  <text x="514" y="150" fill="#e8813a" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">/mode server</text>
  <text x="514" y="167" fill="#e6e6e8" font-size="11" font-weight="600">m1 · mlx_lm.server</text>
  <text x="514" y="181" fill="#9a9a9e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">LaunchAgent · always-on · default</text>

  <!-- /mode solo -->
  <rect x="500" y="230" width="240" height="56" rx="8" fill="#18181b" stroke="rgba(240,240,242,0.30)" stroke-width="1"/>
  <text x="514" y="250" fill="#e8813a" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">/mode solo</text>
  <text x="514" y="267" fill="#e6e6e8" font-size="11" font-weight="600">this Mac · local spawn</text>

  <!-- /mode cluster -->
  <rect x="500" y="322" width="240" height="72" rx="8" fill="#18181b" stroke="rgba(240,240,242,0.30)" stroke-width="1"/>
  <text x="514" y="342" fill="#e8813a" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">/mode cluster</text>
  <text x="514" y="359" fill="#e6e6e8" font-size="11" font-weight="600">both Macs · mlx.launch ring</text>
  <text x="514" y="373" fill="#9a9a9e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">tensor-parallel · models &gt;~38 GB</text>

  <!-- HF cache — focal, cylinder -->
  <g>
    <path d="M790,230 a70,14 0 1,0 140,0 a70,14 0 1,0 -140,0" fill="rgba(232,129,58,0.14)" stroke="#e8813a" stroke-width="1.4"/>
    <path d="M790,230 v70 a70,14 0 0,0 140,0 v-70" fill="rgba(232,129,58,0.14)" stroke="#e8813a" stroke-width="1.4"/>
    <path d="M790,230 a70,14 0 1,0 140,0" fill="none" stroke="#e8813a" stroke-width="1.4"/>
    <text x="860" y="272" text-anchor="middle" fill="#f5ede6" font-size="13" font-weight="600">HF cache</text>
    <text x="860" y="288" text-anchor="middle" fill="#c99a72" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">offline source of truth</text>
  </g>

  <!-- macmon — optional/async -->
  <rect x="760" y="460" width="200" height="56" rx="8" fill="rgba(240,240,242,0.02)" stroke="rgba(240,240,242,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="860" y="484" text-anchor="middle" fill="#e6e6e8" font-size="11" font-weight="600">macmon :9090</text>
  <text x="860" y="500" text-anchor="middle" fill="#9a9a9e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">on each Mac</text>

  <!-- ============ LEGEND ============ -->
  <line x1="40" y1="538" x2="920" y2="538" stroke="rgba(240,240,242,0.10)" stroke-width="0.8"/>
  <rect x="40" y="556" width="14" height="14" rx="3" fill="rgba(232,129,58,0.14)" stroke="#e8813a" stroke-width="1.2"/>
  <text x="62" y="567" fill="#9a9a9e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">focal component</text>
  <rect x="210" y="556" width="14" height="14" rx="3" fill="#18181b" stroke="rgba(240,240,242,0.30)" stroke-width="1"/>
  <text x="232" y="567" fill="#9a9a9e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">component</text>
  <rect x="360" y="556" width="14" height="14" rx="3" fill="rgba(240,240,242,0.02)" stroke="rgba(240,240,242,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="382" y="567" fill="#9a9a9e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">optional / async</text>
</svg>
