<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8813a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" rx="16" fill="#0d0d0f"/>

  <!-- macmon -> mlx-cluster, routed along the clear top/right margin so it
       never crosses the mode boxes or the cache arrows -->
  <path d="M825,452 L825,28 L325,28 L325,88" fill="none" stroke="#e8813a"
        stroke-width="1.3" stroke-dasharray="4 4" stroke-linejoin="round"
        marker-end="url(#arrowOrange)"/>
  <text x="575" y="20" text-anchor="middle" fill="#8a8a8d" font-size="11" font-style="italic">stats every 2s</text>

  <!-- you -->
  <circle cx="90" cy="130" r="34" fill="#161618" stroke="#3a3a3d" stroke-width="1.5"/>
  <text x="90" y="135" text-anchor="middle" fill="#e8e8ea" font-size="15" font-weight="600">you</text>

  <!-- you -> mlx-cluster -->
  <path d="M124,120 C160,112 195,113 228,116" fill="none" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- you -> mlxctl -->
  <path d="M106,160 C150,205 185,225 228,245" fill="none" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- mlx-cluster box -->
  <rect x="230" y="90" width="190" height="60" rx="10" fill="#161618" stroke="#e8813a" stroke-width="1.5"/>
  <text x="325" y="116" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">mlx-cluster</text>
  <text x="325" y="135" text-anchor="middle" fill="#9a9a9d" font-size="11">chat + /agent</text>

  <!-- mlxctl box -->
  <rect x="230" y="230" width="150" height="50" rx="10" fill="#161618" stroke="#3a3a3d" stroke-width="1.5"/>
  <text x="305" y="260" text-anchor="middle" fill="#e8e8ea" font-size="14" font-weight="600">mlxctl</text>

  <!-- mode branches -->
  <rect x="480" y="60" width="230" height="58" rx="10" fill="#161618" stroke="#3a3a3d" stroke-width="1.5"/>
  <text x="494" y="82" fill="#e8813a" font-size="12" font-weight="700">/mode server</text>
  <text x="494" y="99" fill="#c7c7ca" font-size="11">m1 · mlx_lm.server LaunchAgent</text>
  <text x="494" y="112" fill="#7a7a7d" font-size="10">always-on · default</text>

  <rect x="480" y="132" width="230" height="50" rx="10" fill="#161618" stroke="#3a3a3d" stroke-width="1.5"/>
  <text x="494" y="153" fill="#e8813a" font-size="12" font-weight="700">/mode solo</text>
  <text x="494" y="170" fill="#c7c7ca" font-size="11">this Mac · local spawn</text>

  <rect x="480" y="196" width="230" height="58" rx="10" fill="#161618" stroke="#3a3a3d" stroke-width="1.5"/>
  <text x="494" y="218" fill="#e8813a" font-size="12" font-weight="700">/mode cluster</text>
  <text x="494" y="235" fill="#c7c7ca" font-size="11">both Macs · mlx.launch ring</text>
  <text x="494" y="248" fill="#7a7a7d" font-size="10">tensor-parallel · models &gt;~38 GB</text>

  <!-- mlx-cluster -> branches -->
  <path d="M420,105 C445,95 460,92 478,89" fill="none" stroke="#e8813a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path d="M420,120 C445,135 460,150 478,157" fill="none" stroke="#e8813a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path d="M420,135 C450,170 460,205 478,222" fill="none" stroke="#e8813a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- HF cache cylinder -->
  <g>
    <path d="M635,380 a75,14 0 1,0 150,0 a75,14 0 1,0 -150,0" fill="#161618" stroke="#3a3a3d" stroke-width="1.5"/>
    <path d="M635,380 v40 a75,14 0 0,0 150,0 v-40" fill="#161618" stroke="#3a3a3d" stroke-width="1.5"/>
    <path d="M635,380 a75,14 0 1,0 150,0" fill="none" stroke="#3a3a3d" stroke-width="1.5"/>
    <text x="710" y="412" text-anchor="middle" fill="#e8e8ea" font-size="13" font-weight="600">HF cache</text>
    <text x="710" y="428" text-anchor="middle" fill="#7a7a7d" font-size="10">offline source of truth</text>
  </g>

  <!-- mode boxes -> cache, spread across the cylinder's top edge -->
  <path d="M595,118 C630,220 645,300 660,378" fill="none" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M595,182 C625,250 685,320 695,378" fill="none" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M595,254 C630,300 710,340 725,378" fill="none" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- mlxctl -> cache -->
  <path d="M380,255 C480,290 580,340 625,388" fill="none" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- macmon -->
  <rect x="730" y="452" width="190" height="50" rx="10" fill="#161618" stroke="#3a3a3d" stroke-width="1.5"/>
  <text x="825" y="472" text-anchor="middle" fill="#e8e8ea" font-size="12" font-weight="600">macmon :9090</text>
  <text x="825" y="488" text-anchor="middle" fill="#7a7a7d" font-size="10">on each Mac</text>
</svg>
